name: OpenSSF Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    uses: platform-mesh/.github/.github/workflows/job-ossf-scorecard.yml@b2ef3a19ca62f72a7842058ad4b356099d1a0cd1 # main
    permissions:
      security-events: write # Needed to write to the GitHub Security tab
      id-token: write # Needed for OIDC authentication
      contents: read # Needed to read repository contents
      actions: read # Needed to read GitHub Actions workflows
