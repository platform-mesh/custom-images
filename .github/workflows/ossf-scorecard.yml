name: OpenSSF Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    uses: platform-mesh/.github/.github/workflows/job-ossf-scorecard.yml@03e076ff9aebe43ead6b9d77f3bb764a9d411347 # main
    permissions:
      security-events: write # Needed to write to the GitHub Security tab
      id-token: write # Needed for OIDC authentication
      contents: read # Needed to read repository contents
      actions: read # Needed to read GitHub Actions workflows
