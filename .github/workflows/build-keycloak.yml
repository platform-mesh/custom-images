name: Build Keycloak Custom Image

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'images/keycloak/**'
    tags:
      - 'keycloak/v*'
  pull_request:
    branches:
      - main
    paths:
      - 'images/keycloak/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs, but let pushes to main / tags / manual runs
  # finish so an in-progress image push + attestation is never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/keycloak

jobs:
  build:
    name: build-keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Needed for docker/build-push-action to push the image to the registry
      id-token: write # Needed for actions/attest-build-provenance to mint the OIDC token for keyless signing
      attestations: write # Needed for actions/attest-build-provenance to write the attestation to the repository
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/keycloak/')
        run: echo "version=${GITHUB_REF#refs/tags/keycloak/}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=match,pattern=keycloak/(v.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/keycloak/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./images/keycloak
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom:
    if: startsWith(github.ref, 'refs/tags/keycloak/')
    needs: [build]
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@03e076ff9aebe43ead6b9d77f3bb764a9d411347 # main
    with:
      imageReference: ghcr.io/${{ github.repository }}/keycloak:${{ needs.build.outputs.version }}

  image-ocm:
    if: startsWith(github.ref, 'refs/tags/keycloak/')
    needs: [build, sbom]
    uses: platform-mesh/.github/.github/workflows/job-image-ocm.yml@03e076ff9aebe43ead6b9d77f3bb764a9d411347 # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      imageReference: ghcr.io/${{ github.repository }}/keycloak:${{ needs.build.outputs.version }}
      appVersion: ${{ needs.build.outputs.version }}
      repoName: custom-images
      componentName: "github.com/platform-mesh/custom-images/keycloak"
      commit: ${{ github.sha }}
