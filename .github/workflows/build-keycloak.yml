name: Build Keycloak Custom Image

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'images/keycloak/**'
    tags:
      - 'keycloak/v*'
  pull_request:
    branches:
      - main
    paths:
      - 'images/keycloak/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs, but let pushes to main / tags / manual runs
  # finish so an in-progress image push + attestation is never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/keycloak

jobs:
  build:
    name: build-keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Needed for docker/build-push-action to push the image to the registry
      id-token: write # Needed for actions/attest-build-provenance to mint the OIDC token for keyless signing
      attestations: write # Needed for actions/attest-build-provenance to write the attestation to the repository
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/keycloak/')
        run: echo "version=${GITHUB_REF#refs/tags/keycloak/}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=match,pattern=keycloak/(v.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/keycloak/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/keycloak
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom:
    if: startsWith(github.ref, 'refs/tags/keycloak/')
    needs: [build]
    permissions:
      contents: read # Needed to read repository contents
      packages: read # Needed to pull the image from GHCR to generate the SBOM
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    with:
      imageReference: ghcr.io/${{ github.repository }}/keycloak:${{ needs.build.outputs.version }}

  image-ocm:
    if: startsWith(github.ref, 'refs/tags/keycloak/')
    needs: [build, sbom]
    permissions:
      contents: read # Needed to read repository contents
      packages: write # Needed to push the signed OCM component to GHCR
    uses: platform-mesh/.github/.github/workflows/job-image-ocm.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      imageReference: ghcr.io/${{ github.repository }}/keycloak:${{ needs.build.outputs.version }}
      appVersion: ${{ needs.build.outputs.version }}
      repoName: custom-images
      componentName: "github.com/platform-mesh/custom-images/keycloak"
      commit: ${{ github.sha }}
