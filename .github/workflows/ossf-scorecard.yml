name: OpenSSF Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    uses: platform-mesh/.github/.github/workflows/job-ossf-scorecard.yml@ed8f9da56e7a995c3572ab0a87f143fa675208ef # main # zizmor: ignore[stale-action-refs]
    permissions:
      security-events: write # Needed to write to the GitHub Security tab
      id-token: write # Needed for OIDC authentication
      contents: read # Needed to read repository contents
      actions: read # Needed to read GitHub Actions workflows
